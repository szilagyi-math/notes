name: Repository checks and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Privacy and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install metadata inspector
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libimage-exiftool-perl
      - name: Install pinned secret scanner
        run: bash tools/ci/install-gitleaks.sh
      - name: Scan complete fetched history
        run: gitleaks git --log-opts='--all --full-history' --redact=100 --no-banner --log-level error
      - name: Check tracked metadata, local configuration and binary sizes
        run: python3 tools/privacy/check.py
      - name: Test privacy guardrails
        run: python3 -m unittest discover -s tools/privacy -p 'test_*.py'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm generate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generate
          path: generate
          if-no-files-found: error
          retention-days: 3

  latex:
    name: LaTeX build
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: texlive/texlive@sha256:b20c42c2a5b1be892c26e6d3b896e9aa20350528ddd0d4444d23e5925ea1545d
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generate
          path: generate
      # Existing gnuplot diagrams need TeX shell escape. This isolated job
      # has no deployment secret, write permission or persistent credentials.
      - name: Compile with checkout-local TeX packages
        run: bash tools/build/compile-latex.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latex-docs
          path: latex-docs/*.pdf
          if-no-files-found: error
          retention-days: 3

  web:
    name: Web build and links
    needs: latex
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc libimage-exiftool-perl
          python3 -m pip install -r tools/privacy/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: latex-docs
          path: latex-docs
      - run: python3 tools/privacy/clean.py latex-docs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm practice:html
      - run: pnpm site:assemble
      - run: pnpm check:links
      - name: Check published media
        run: python3 tools/privacy/check.py --directory out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy main to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: site
      - uses: JamesIves/github-pages-deploy-action@6c2d9db40f9296374acc17b90404b6e8864128c8 # v4.7.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: site
          force: false
